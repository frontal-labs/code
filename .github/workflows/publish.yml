name: Publish SDKs and CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  # ── Check changeset status ────────────────────────────────────
  changeset-status:
    name: changeset status
    runs-on: ubuntu-latest
    outputs:
      hasChangesets: ${{ steps.changeset.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
      - uses: changesets/action@v1
        id: changeset
        with:
          publish: npx changeset publish
          version: npx changeset version
          check: npx changeset status --since origin/main

  # ── Build TypeScript SDK ──────────────────────────────────────
  typescript:
    name: typescript sdk (build + test)
    needs: [changeset-status]
    if: needs.changeset-status.outputs.hasChangesets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install workspace dependencies
        run: bun install

      - name: Biome check
        run: bunx @biomejs/biome@2.5.14 ci sdks/typescript

      - name: Build SDK
        run: bun run --filter @frontal-labs/code-sdk build

      - name: Test SDK
        run: bun run --filter @frontal-labs/code-sdk test

  # ── Build Rust SDK ────────────────────────────────────────────
  rust:
    name: rust sdk (fmt + clippy + test)
    needs: [changeset-status]
    if: needs.changeset-status.outputs.hasChangesets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check formatting
        run: cargo fmt -p frontal-code-sdk -- --check

      - name: Clippy
        run: cargo clippy -p frontal-code-sdk --all-targets -- -D warnings

      - name: Test
        run: cargo test -p frontal-code-sdk

  # ── Build CLI ─────────────────────────────────────────────────
  cli:
    name: cli (build)
    needs: [changeset-status]
    if: needs.changeset-status.outputs.hasChangesets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install workspace dependencies
        run: bun install

      - name: Build TypeScript SDK (CLI dependency)
        run: bun run --filter @frontal-labs/code-sdk build

      - name: Verify CLI package
        working-directory: npm/code-cli
        run: ./scripts/verify.sh

  # ── Publish all packages ──────────────────────────────────────
  # npm packages (@frontal-labs/code-sdk, @frontal-labs/code-cli) are
  # published to npmjs.org by `changeset publish` below, so there is one
  # publish path per package.
  publish:
    name: publish packages
    needs: [typescript, rust, cli]
    if: needs.changeset-status.outputs.hasChangesets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install workspace dependencies
        run: bun install

      - name: Build TypeScript SDK
        run: bun run --filter @frontal-labs/code-sdk build

      - name: Publish Rust SDK to crates.io
        working-directory: sdks/rust
        # cargo reads CARGO_REGISTRY_TOKEN from the environment; never pass it as an argument.
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push TypeScript SDK image (code-sdk-ts)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sdks/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/code-sdk-ts:latest
            ghcr.io/${{ github.repository }}/code-sdk-ts:${{ github.sha }}
          cache-from: type=gha,scope=code-sdk-ts
          cache-to: type=gha,mode=max,scope=code-sdk-ts

      - name: Build and push Rust SDK image (code-sdk-rs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sdks/rust/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/code-sdk-rs:latest
            ghcr.io/${{ github.repository }}/code-sdk-rs:${{ github.sha }}
          cache-from: type=gha,scope=code-sdk-rs
          cache-to: type=gha,mode=max,scope=code-sdk-rs

      - name: Run changeset publish
        run: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
