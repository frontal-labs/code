name: Renovate

on:
  # Run Renovate on a schedule (kept in sync with the renovate.json `schedule`).
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 6 AM UTC
  # Allow manual triggers and quick retries.
  workflow_dispatch:
  # Re-run when the Renovate config changes.
  push:
    branches:
      - main
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

# Renovate needs write access to open/update PRs and manage its own branches.
# security-events: read is granted so that if Dependabot security alerts are
# enabled at the org level, Renovate can read them. vulnerabilityAlerts is
# currently disabled in renovate.json (Dependabot is not enabled for this repo).
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  security-events: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v42.0.3
        with:
          configurationFile: renovate.json
          # Pin Renovate to major 44 (latest stable). The action defaults to
          # major 40, which has a crates.io version-metadata bug
          # (renovatebot/renovate#37537) that causes "Release interceptor
          # failed for crate" warnings. Fixed in Renovate 41+.
          renovate-version: "44"
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_USERNAME: ${{ github.actor }}
          LOG_LEVEL: info
