name: SDK CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - '.github/workflows/sdk.yml'
      - 'biome.json'
      - 'ultracite.json'
      - 'bunfig.toml'
      - 'package.json'
      - 'tools/**'
      - 'sdks/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sdk.yml'
      - 'biome.json'
      - 'ultracite.json'
      - 'bunfig.toml'
      - 'package.json'
      - 'tools/**'
      - 'sdks/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # NPM_TOKEN is intentionally not set here. This workflow runs on pull_request and
  # must never expose publish credentials to build/test steps.

jobs:
  # ── TypeScript SDK: Biome + Bun (Vitest) ───────────────────────────────
  typescript:
    name: typescript sdk (biome + bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.1.38"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace dependencies
        # Lifecycle scripts are not needed for lint/build/test; skipping them keeps
        # untrusted PR code from running install hooks.
        run: bun install --ignore-scripts

      - name: Biome check
        run: bunx @biomejs/biome@2.5.14 ci .

      - name: Build SDK
        run: bun run --filter @frontal-labs/code-sdk build

      - name: Test SDK
        run: bun run --filter @frontal-labs/code-sdk test

  # ── Rust SDK: rustfmt + clippy + cargo test ─────────────────────────────
  rust:
    name: rust sdk (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check formatting
        run: cargo fmt -p frontal-code-sdk -- --check

      - name: Clippy
        run: cargo clippy -p frontal-code-sdk --all-targets -- -D warnings

      - name: Test
        run: cargo test -p frontal-code-sdk
