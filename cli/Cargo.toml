[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# `cargo run -p cli` runs `code`; `frontal-code` is run with --bin frontal-code.
default-run = "code"

[[bin]]
name = "code"
path = "src/main.rs"

# Both names run the same CLI. `frontal-code` runs the `code` beside it (see src/bin/frontal-code.rs).
[[bin]]
name = "frontal-code"
path = "src/bin/frontal-code.rs"

[dependencies]
code-api = { path = "../crates/code-api" }
code-commands = { path = "../crates/code-commands" }
code-harness = { path = "../crates/code-harness" }
code-core = { path = "../crates/code-core" }
crossterm = "0.29"
futures-util = "0.3"
code-events = { path = "../crates/code-events" }
code-repo = { path = "../crates/code-repo" }
pulldown-cmark = "0.13"
ratatui = "0.30"
rustyline = "19"
code-runtime = { path = "../crates/code-runtime" }
code-integrations = { path = "../crates/code-integrations" }
code-plugins = { path = "../crates/code-plugins" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
code-tools = { path = "../crates/code-tools" }

[lints]
workspace = true

[dev-dependencies]
code-mock-gateway = { path = "../tests/mock-gateway" }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
