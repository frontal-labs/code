[package]
name = "frontal-code-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "frontal-code"
path = "src/main.rs"

[dependencies]
frontal-code-api = { path = "../api" }
frontal-code-commands = { path = "../commands" }
frontal-code-harness = { path = "../harness" }
frontal-code-core = { path = "../core" }
crossterm = "0.28"
futures-util = "0.3"
frontal-code-events = { path = "../events" }
frontal-code-repo = { path = "../repo" }
pulldown-cmark = "0.13"
rustyline = "15"
frontal-code-runtime = { path = "../runtime" }
frontal-code-integrations = { path = "../integrations" }
frontal-code-plugins = { path = "../plugins" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
frontal-code-tools = { path = "../tools" }

[lints]
workspace = true

[dev-dependencies]
frontal-code-mock-gateway = { path = "../../tests/mock-gateway" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }
