[package]
name = "code-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
code-core = { path = "../code-core" }
sha2 = "0.10"
glob = "0.3"
getrandom = "0.2"
code-plugins = { path = "../code-plugins" }
code-integrations = { path = "../code-integrations" }
code-sandbox = { path = "../code-sandbox" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
code-telemetry = { path = "../code-telemetry" }
code-types = { path = "../code-types" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }
walkdir = "2"

[lints]
workspace = true
