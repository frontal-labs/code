[package]
name = "code-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "code-server"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
code-events = { path = "../code-events" }
code-integrations = { path = "../code-integrations" }
code-orchestrator = { path = "../code-orchestrator" }
code-repo = { path = "../code-repo" }
code-types = { path = "../code-types" }
code-runtime = { path = "../code-runtime" }
code-tools = { path = "../code-tools" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
