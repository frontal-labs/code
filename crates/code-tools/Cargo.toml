[package]
name = "code-tools"

[dependencies]
code-api = { path = "../code-api" }
code-commands = { path = "../code-commands" }
code-plugins = { path = "../code-plugins" }
code-runtime = { path = "../code-runtime" }
code-memory = { path = "../code-memory" }
code-training = { path = "../code-training" }
code-telemetry = { path = "../code-telemetry" }
code-integrations = { path = "../code-integrations" }
code-webhooks = { path = "../code-webhooks" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
