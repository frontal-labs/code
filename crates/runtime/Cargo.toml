[package]
name = "frontal-code-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
frontal-code-core = { path = "../core" }
sha2 = "0.10"
glob = "0.3"
frontal-code-plugins = { path = "../plugins" }
frontal-code-integrations = { path = "../integrations" }
frontal-code-sandbox = { path = "../sandbox" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
frontal-code-telemetry = { path = "../telemetry" }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }
walkdir = "2"

[lints]
workspace = true
