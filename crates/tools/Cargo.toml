[package]
name = "frontal-code-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
frontal-code-api = { path = "../api" }
frontal-code-commands = { path = "../commands" }
frontal-code-plugins = { path = "../plugins" }
frontal-code-runtime = { path = "../runtime" }
frontal-code-memory = { path = "../memory" }
frontal-code-training = { path = "../training" }
frontal-code-telemetry = { path = "../telemetry" }
frontal-code-integrations = { path = "../integrations" }
frontal-code-webhooks = { path = "../webhooks" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
