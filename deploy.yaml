app: frontal-code
primary_region: iad
build:
  dockerfile: infrastructure/docker/frontal-code-fly.Dockerfile
env:
  FRONTAL_CODE_SERVER_HOST: "0.0.0.0"
  FRONTAL_CODE_SERVER_PORT: "8788"
  FRONTAL_CODE_SERVER_LANE_TRANSPORT: "tools-agent"
  FRONTAL_CODE_SERVER_STATE_FILE: "/var/lib/frontal-code/server/state.json"
  FRONTAL_CODE_SERVER_WORKSPACE_ROOT: "/workspace/workspaces"
  FRONTAL_CODE_SERVER_RECONCILE_INTERVAL_SECS: "15"
  FRONTAL_CODE_AGENT_STORE: "/var/lib/frontal-code/agents"
  RUST_LOG: "info"
http_service:
  internal_port: 8788
  force_https: true
  auto_stop_machines: true
  auto_start_machines: true
  min_machines_running: 1
  checks:
    grace_period: "10s"
    interval: "30s"
    method: "GET"
    path: "/health"
    timeout: "5s"
mounts:
  source: "frontal-code_state"
  destination: "/var/lib/frontal-code/server"
machines:
  code-prod:
    image: ghcr.io/frontal-labs/frontal-code-server:latest
    name: code-prod
    size: shared-cpu-1x
    region: iad
    env:
      FRONTAL_CODE_SERVER_HOST: "0.0.0.0"
      FRONTAL_CODE_SERVER_PORT: "8788"
      FRONTAL_CODE_SERVER_LANE_TRANSPORT: "tools-agent"
      FRONTAL_CODE_SERVER_STATE_FILE: "/var/lib/frontal-code/server/state.json"
      FRONTAL_CODE_SERVER_WORKSPACE_ROOT: "/workspace/workspaces"
      FRONTAL_CODE_SERVER_RECONCILE_INTERVAL_SECS: "15"
      FRONTAL_CODE_AGENT_STORE: "/var/lib/frontal-code/agents"
      RUST_LOG: "info"
      NODE_ENV: "production"
    mounts:
      source: frontal-code_state_prod
      destination: /var/lib/frontal-code/server
    health_check:
      path: /health
      interval: "30s"
      timeout: "5s"
      grace_period: "10s"
  code-dev:
    image: ghcr.io/frontal-labs/frontal-code-server:latest
    name: code-dev
    size: shared-cpu-1x
    region: iad
    env:
      FRONTAL_CODE_SERVER_HOST: "0.0.0.0"
      FRONTAL_CODE_SERVER_PORT: "8788"
      FRONTAL_CODE_SERVER_LANE_TRANSPORT: "tools-agent"
      FRONTAL_CODE_SERVER_STATE_FILE: "/var/lib/frontal-code/server/state.json"
      FRONTAL_CODE_SERVER_WORKSPACE_ROOT: "/workspace/workspaces"
      FRONTAL_CODE_SERVER_RECONCILE_INTERVAL_SECS: "15"
      FRONTAL_CODE_AGENT_STORE: "/var/lib/frontal-code/agents"
      RUST_LOG: "debug"
      NODE_ENV: "development"
    mounts:
      source: frontal-code_state_dev
      destination: /var/lib/frontal-code/server
    health_check:
      path: /health
      interval: "30s"
      timeout: "5s"
      grace_period: "10s"
