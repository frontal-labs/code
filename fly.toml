app = "frontal-code"
primary_region = "iad"

[build]
  dockerfile = "infrastructure/docker/frontal-code-fly.Dockerfile"

[env]
  FCODE_SERVER_HOST = "0.0.0.0"
  FCODE_SERVER_PORT = "8788"
  FCODE_SERVER_LANE_TRANSPORT = "tools-agent"
  FCODE_SERVER_STATE_FILE = "/var/lib/frontal-code/server/state.json"
  FCODE_SERVER_WORKSPACE_ROOT = "/workspace/workspaces"
  FCODE_SERVER_RECONCILE_INTERVAL_SECS = "15"
  FCODE_AGENT_STORE = "/var/lib/frontal-code/agents"
  RUST_LOG = "info"

[http_service]
  internal_port = 8788
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[mounts]
  source = "frontal-code_state"
  destination = "/var/lib/frontal-code/server"
