apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontal-code-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontal-code-server
  template:
    metadata:
      labels:
        app: frontal-code-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontal-code-server
          image: frontal-code-server:v0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 8788
              name: http
          workingDir: /workspace
          envFrom:
            - configMapRef:
                name: frontal-code-server-config
            - secretRef:
                name: frontal-code-server-secrets
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: server-state
              mountPath: /var/lib/frontal-code/server
            - name: agent-store
              mountPath: /var/lib/frontal-code/agents
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: frontal-code-workspace
        - name: server-state
          persistentVolumeClaim:
            claimName: frontal-code-server-state
        - name: agent-store
          persistentVolumeClaim:
            claimName: frontal-code-agent-store
---
apiVersion: v1
kind: Service
metadata:
  name: frontal-code-server
spec:
  selector:
    app: frontal-code-server
  ports:
    - name: http
      port: 8788
      targetPort: http
