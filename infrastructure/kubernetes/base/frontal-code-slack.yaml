apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontal-code-slack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontal-code-slack
  template:
    metadata:
      labels:
        app: frontal-code-slack
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontal-code-slack
          image: frontal-code-slack:v0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          envFrom:
            - configMapRef:
                name: frontal-code-slack-config
            - secretRef:
                name: frontal-code-slack-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["sh", "-c", "pidof node >/dev/null"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pidof node >/dev/null"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
