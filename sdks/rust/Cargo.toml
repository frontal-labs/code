[package]
name = "frontal-code-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = true
description = "Embed the Frontal Code agent in your Rust workflows and apps by wrapping the frontal-code CLI."
repository = "https://github.com/frontal-labs/frontal-code"
homepage = "https://frontal.dev"
documentation = "https://docs.rs/frontal-code-sdk"
readme = "README.md"
keywords = ["frontal-code", "ai", "agent", "cli", "sdk"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.80.0"

[dependencies]
tokio = { version = "1", features = ["process", "rt", "macros", "io-util", "sync"] }
serde_json = "1"
thiserror = "1"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
